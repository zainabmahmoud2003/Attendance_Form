<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Attendance</title>

    <!-- CSS -->
    <link rel="stylesheet" href="CSS/attendanceForm.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Outfit:wght@400;600&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="image-holder">
            <img class="imgLarge" src="/images/imgLarge.png"
                alt="IEEE SVU SB Tech Banner">
            <img class="imgMobile" src="/images/imgMobile.jpg" alt="IEEE SVU SB Tech Banner">
        </div>

        <div class="form">
            <form class="attendanceForm" id="attendanceForm">
                <div class="text">
                    <h1>Attendance Registration</h1>
                </div>

                <div class="field">
                    <input type="text" id="fullName" name="fullName" required placeholder=" ">
                    <label for="fullName">Full Name</label>
                    <small class="note">Please enter your name as you want it to appear on the certificate</small>
                </div>

                <div class="field">
                    <input type="text" id="contact" name="contact" required placeholder=" ">
                    <label for="contact">Phone Number or Email</label>
                    <small class="note">Use the same phone number or email every day</small>
                </div>

                <div class="field">
                    <input type="text" id="department" name="department" required placeholder=" ">
                    <label for="department">Department</label>
                </div>

                <div class="field">
                    <select class="year" name="year" id="year" required>
                        <option value="" disabled selected></option>
                        <option value="year 1">1st Year</option>
                        <option value="year 2">2nd Year</option>
                        <option value="year 3">3rd Year</option>
                        <option value="year 4">4th Year</option>
                        <option value="year 5">5th Year</option>
                    </select>
                    <label for="year">Select your academic year</label>
                </div>

                <div class="field">
                    <input type="text" id="sessionCode" name="sessionCode" required placeholder=" ">
                    <label for="sessionCode">Session Code</label>
                </div>

                <button type="submit" class="submitBtn" id="submitBtn">Submit Attendance</button>

                <div id="message" class="message"></div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; IEEE SVU SB | Season 2026-2027</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
